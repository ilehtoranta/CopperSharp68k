name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Build and fast tests
            filter: Category!=Emulator&FullyQualifiedName!~CompilerExecutionTests
            timeout: 15
            artifact: fast-test-results
          - name: Compiler execution tests
            filter: FullyQualifiedName~CompilerExecutionTests
            timeout: 45
            artifact: execution-test-results

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore CopperSharp68k.slnx

      - name: Build
        run: dotnet build CopperSharp68k.slnx --configuration Debug --no-restore

      - name: Test
        run: >-
          dotnet test CopperSharp68k.slnx
          --configuration Debug
          --no-build
          --filter "${{ matrix.filter }}"
          --logger "trx;LogFileName=tests.trx"
          --results-directory TestResults

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 14
